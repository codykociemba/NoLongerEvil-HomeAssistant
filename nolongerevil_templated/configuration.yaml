template:
  climate:
    - name: "First Thermostat"
      unique_id: first_thermostat_thermostat_rest
      
      # Read States from REST Sensors
      current_temperature: "{{ states('sensor.first_thermostat_current_temperature') | float(21.0) }}"
      target_temperature: "{{ states('sensor.first_thermostat_target_temperature') | float(21.0) }}"
      current_humidity: "{{ states('sensor.first_thermostat_humidity') | float(21.0) }}"
      hvac_mode: "{{ states('sensor.first_thermostat_mode') }}"
      fan_mode: "{{ states('sensor.first_thermostat_fan_mode') }}"
      
      # Available Modes
      hvac_modes: "{{ ['off', 'heat', 'cool'] }}"
      fan_modes: "{{ ['auto', 'on'] }}"
      
      # Write Actions (Triggers REST commands when you click UI buttons)
      set_temperature:
        action: rest_command.first_thermostat_set_temp
        data:
          temperature: "{{ ((temperature - 32) * 5 / 9) | round(1) }}"
      set_hvac_mode:
        action: rest_command.first_thermostat_set_mode
        data:
          hvac_mode: "{{ hvac_mode }}"
      set_fan_mode:
        action: rest_command.first_thermostat_set_fan_mode
        data:
          fan_mode: "{{ fan_mode }}"


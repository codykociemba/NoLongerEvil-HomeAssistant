########## NLE Template APIs #################
rest:
  - resource: "http://<your_standalone_server_ip>:8082/status?serial=<first thermostat serial>"
    scan_interval: 60  # How often to poll the API (in seconds)
    sensor:
      - name: "First Thermostat Current Temperature"
        value_template: "{{ value_json.current_temperature }}"
        device_class: temperature
        unit_of_measurement: "°C"
        
      - name: "First Thermostat Target Temperature"
        value_template: "{{ value_json.target_temperature }}"
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "First Thermostat Mode"
        value_template: "{{ value_json.mode }}"

      - name: "First Thermostat Humidity"
        value_template: "{{ value_json.humidity }}"

      - name: "First Thermostat Fan Mode"
        value_template: "{{ 'on' if value_json.fan_timer_active else 'auto' }}"


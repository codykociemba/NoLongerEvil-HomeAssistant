rest_command:
  first_thermostat_set_temp:
    url: "http://<your_standalone_server_ip>:8082/command"
    method: POST
    headers:
      content-type: "application/json"
    payload: '{"serial":"<first thermostat serial>", "command":"set_temperature", "value": {{ temperature }} }'

  first_thermostat_set_mode:
    url: "http://<your_standalone_server_ip>:8082/command"
    method: POST
    headers:
      content-type: "application/json"
    payload: '{"serial":"<first thermostat serial>","command":"set_mode","value": "{{ hvac_mode }}" }'

  first_thermostat_set_fan_mode:
    url: "http://<your_standalone_server_ip>:8082/command"
    method: POST
    headers:
      content-type: "application/json"
    payload: '{"serial":"<first thermostat serial>","command":"set_fan","value": "{{ fan_mode }}" }'    

